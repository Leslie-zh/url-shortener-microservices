version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener123
      POSTGRES_DB: shortener_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener_db"]
      interval: 3s
      timeout: 3s
      retries: 5
  link-service:
    build: ./link-service
    image: lesleychow/link-service:latest
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgresql+psycopg2://shortener:shortener123@db:5432/shortener_db
      - ANALYTICS_URL=http://analytics-service:8001 
    depends_on:
      db:
        condition: service_healthy 
  analytics-service:
    build: ./analytics-service
    image: lesleychow/analytics-service:latest
    ports:
      - 8001:8001
    environment:
      - DATABASE_URL=postgresql+psycopg2://shortener:shortener123@db:5432/shortener_db
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: lesleychow/frontend:latest
    ports:
      - "8080:80" 
volumes:
  pgdata: